server {
    listen 80;
    server_name _;

    # ── Gzip compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;

    # ── Static frontend assets ─────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # No cache for index.html (ensures users always get latest app shell)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # ── Long-term cache for hashed JS/CSS/image assets ────────────
    # Vite produces content-hashed filenames (e.g. chunk-ABC123.js).
    # These never change content for a given hash, so we cache aggressively.
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Proxy all /api/ calls to the backend container ─────────────
    location /api/ {
        proxy_pass http://dlv_backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for httpOnly cookie (refresh token) to pass through correctly
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / "/; SameSite=Lax";
        proxy_read_timeout 60s;

        # Enable keepalive to backend
        keepalive_timeout 65;
    }

    # ── Uploaded files ──────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://dlv_backend:4000;
        proxy_set_header Host $host;
        # Cache uploaded images for 7 days
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
